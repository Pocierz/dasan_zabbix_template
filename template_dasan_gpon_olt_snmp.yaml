              value: raw
        - uuid: 7e4190864fd645688717e920a5a95f04
          name: 'Interfaces: Get status'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.2.1.2.2.1.8,1.3.6.1.2.1.2.2.1.7,1.3.6.1.2.1.31.1.1.1.15]'
          key: net.if.walk.status
          history: '0'
          value_type: TEXT
          tags:
            - tag: component
