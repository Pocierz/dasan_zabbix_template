zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 9004e4c0b8674f1880052388bb3752fb
      name: 'Templates/Net Network devices'
  templates:
    - uuid: a9ecc0b1d6e646d9b6c72c7cffacf14a
      template: 'DASAN GPON OLT SLE by SNMP'
      name: 'DASAN GPON OLT SLE by SNMP'
      description: |
        DASAN / DZS GPON OLT (SLE platform, e.g. V8102 running NOS 2.x)
        monitored over SNMP.
         
        Built from a live snmpwalk of a V8102 OLT (32 PON ports, 4x 10G uplinks,
        1767 provisioned ONTs)  and cross-checked against SLE-GPON-MIB and
        DASAN-SWITCH-MIB.
        
        What it collects
        ----------------
         * Per-port traffic on the XE uplinks and the GPON PON ports: bits in/out plus
          separate unicast,  multicast and broadcast packet rates in both directions
          (IF-MIB 64-bit counters), errors,  discards, link state and speed.
        * Per-ONT data from sleGponOnuTable and sleGponOnuAniTable:  status and
          deactivation reason, ONT Rx/Tx optical power, the upstream power the OLT sees,
           module temperature/voltage/bias, fibre distance, link uptime, up/down counters
          and PON-layer  BIP8/FEC error rates.
        * OLT health: CPU load, memory, uptime, model, serial and firmware.
         
        Design
        ------
        All bulk data is fetched with a handful of SNMP `walk[]` master items; every
         per-interface and per-ONT item is a dependent item. On the reference OLT that
        turns ~25000 metrics  into 10 SNMP requests per cycle. The master items keep no
        history.
        
        Portability
        -----------
         Nothing is bound to a particular chassis. Ports and ONTs come from two low-level
        discovery rules,  so any port count, slot count and ONT count is handled
        automatically:
        
        * Interface discovery  keeps every interface with a non-zero ifHighSpeed, so it
          does not care whether the ports  are called XE0/1, GE1, TE1/1 or GPON2/16.
        * ONT discovery reads the real PON port name from  ifDescr rather than decoding
          the ifIndex numbering, so a chassis with a different ifIndex  scheme still gets
          correct labels.
        
        The template therefore fits any DASAN/DZS OLT on the  SLE platform that
        implements SLE-GPON-MIB (sleGpon = .1.3.6.1.4.1.6296.101.23). It does NOT  fit
        the EPON tree (sleEpon, sleMgmt 20) or the older DSSHE platform. The CPU and
        memory items  come from DASAN-SWITCH-MIB and are shared across DASAN devices; if
        a given box does not implement  them those few items simply go unsupported and
        nothing else is affected.
        
        Known limitation
         ----------------
        This firmware does not expose per-ONT byte/packet counters. The ONU performance
         tables (sleGponOnuPMStatistics, .7.2 and .7.3) are present but return 0 for every
        ONT, so per-subscriber  traffic graphs are not possible over SNMP until ONU
        performance monitoring is enabled on the  OLT. The PON-layer counters that are
        populated (BIP8, FEC) are included instead.
        
        Requirements
         ------------
        Zabbix 7.4 or newer. SNMPv2c or SNMPv3. Use bulk requests (default) - the ONT
         walks are large.
      vendor:
        name: community
        version: 7.4-1
      groups:
        - name: 'Templates/Net Network devices'
      items:
        - uuid: 4afd26cbecd541c08b9af8329757384a
          name: 'GPON: ONTs active'
          type: DEPENDENT
          key: gpon.ont.count.active
          history: 90d
          description: 'ONTs with sleGponOnuStatus = active(2).'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var re = /^\.?1\.3\.6\.1\.4\.1\.6296\.101\.23\.3\.1\.1\.2\.[0-9.]+\s*=\s*(?:[A-Za-z0-9-]+:\s*)?(-?\d+)\s*$/;
                  var total = 0, active = 0;
                  value.split('\n').forEach(function (line) {
                      var m = re.exec(line.trim());
                      if (m) { total++; if (m[1] === '2') { active++; } }
                  });
                  return active;
                  
          master_item:
            key: gpon.ont.walk.status
          tags:
            - tag: component
              value: gpon
        - uuid: 6690e543be8e440a92b9c2f707165890
          name: 'GPON: ONTs inactive'
          type: DEPENDENT
          key: gpon.ont.count.inactive
          history: 90d
          description: 'Provisioned ONTs that are currently not active.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var re = /^\.?1\.3\.6\.1\.4\.1\.6296\.101\.23\.3\.1\.1\.2\.[0-9.]+\s*=\s*(?:[A-Za-z0-9-]+:\s*)?(-?\d+)\s*$/;
                  var total = 0, active = 0;
                  value.split('\n').forEach(function (line) {
                      var m = re.exec(line.trim());
                      if (m) { total++; if (m[1] === '2') { active++; } }
                  });
                  return (total - active);
                  
          master_item:
            key: gpon.ont.walk.status
          tags:
            - tag: component
              value: gpon
        - uuid: ff9a938caacd4d29a9dab119b3b9d36a
          name: 'GPON: ONTs total'
          type: DEPENDENT
          key: gpon.ont.count.total
          history: 90d
          description: 'Number of ONTs provisioned on the OLT.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var re = /^\.?1\.3\.6\.1\.4\.1\.6296\.101\.23\.3\.1\.1\.2\.[0-9.]+\s*=\s*(?:[A-Za-z0-9-]+:\s*)?(-?\d+)\s*$/;
                  var total = 0, active = 0;
                  value.split('\n').forEach(function (line) {
                      var m = re.exec(line.trim());
                      if (m) { total++; if (m[1] === '2') { active++; } }
                  });
                  return total;
                  
          master_item:
            key: gpon.ont.walk.status
          tags:
            - tag: component
              value: gpon
        - uuid: cebd667df66c4a6996348d9e4deb913b
          name: 'GPON ONT: Get discovery data'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.6296.101.23.3.1.1.4,1.3.6.1.4.1.6296.101.23.3.1.1.8,1.3.6.1.4.1.6296.101.23.3.1.1.17,1.3.6.1.4.1.6296.101.23.3.1.1.18,1.3.6.1.2.1.2.2.1.2]'
          key: gpon.ont.walk.discovery
          delay: 1h
          history: '0'
          value_type: TEXT
          description: 'sleGponOnuSerial / Profile / ModelName / Description, plus ifDescr so the discovery rule can label each ONT with the real PON port name instead of deriving it from the ifIndex numbering scheme.'
          timeout: 30s
          tags:
            - tag: component
              value: raw
        - uuid: 3c3385db4da0415898074f8147cd018b
          name: 'GPON ONT: Get PON layer statistics'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.6296.101.23.7.1.3.1.4,1.3.6.1.4.1.6296.101.23.7.1.3.1.6,1.3.6.1.4.1.6296.101.23.7.1.3.1.7]'
          key: gpon.ont.walk.fec
          delay: 15m
          history: '0'
          value_type: TEXT
          description: 'sleGponOltStatsOnu: BIP8 errors, FEC uncorrected/corrected codewords.'
          timeout: 30s
          tags:
            - tag: component
              value: raw
        - uuid: d536fb7c776d481bbd3e1fb2e0c334a8
          name: 'GPON ONT: Get optical diagnostics'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.6296.101.23.6.6.1.1.16,1.3.6.1.4.1.6296.101.23.6.6.1.1.17,1.3.6.1.4.1.6296.101.23.6.6.1.1.18,1.3.6.1.4.1.6296.101.23.6.6.1.1.19,1.3.6.1.4.1.6296.101.23.6.6.1.1.20]'
          key: gpon.ont.walk.optic
          delay: 10m
          history: '0'
          value_type: TEXT
          description: 'sleGponOnuAni DDM: temperature, voltage, Tx bias, Tx power, Rx power. Values arrive as decimal strings.'
          timeout: 30s
          tags:
            - tag: component
              value: raw
        - uuid: 5e5adbf516b546e19c51b5408fdb7083
          name: 'GPON ONT: Get state'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.6296.101.23.3.1.1.10,1.3.6.1.4.1.6296.101.23.3.1.1.16,1.3.6.1.4.1.6296.101.23.3.1.1.21,1.3.6.1.4.1.6296.101.23.3.1.1.23,1.3.6.1.4.1.6296.101.23.3.1.1.51,1.3.6.1.4.1.6296.101.23.3.1.1.52]'
          key: gpon.ont.walk.state
          delay: 5m
          history: '0'
          value_type: TEXT
          description: 'Distance, ONT Rx power, OLT Rx power, link uptime, up/down counters.'
          timeout: 30s
          tags:
            - tag: component
              value: raw
        - uuid: 7afb084a0ee54d8480e32f667f728bdb
          name: 'GPON ONT: Get status'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.6296.101.23.3.1.1.2,1.3.6.1.4.1.6296.101.23.3.1.1.45]'
          key: gpon.ont.walk.status
          delay: 2m
          history: '0'
          value_type: TEXT
          description: 'sleGponOnuStatus + sleGponOnuDeactiveReason. Kept on a short interval because ONT up/down alerting depends on it.'
          timeout: 30s
          tags:
            - tag: component
              value: raw
        - uuid: f723a2e08ee342ddab452d435f8e9129
