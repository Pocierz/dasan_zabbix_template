        - uuid: 3e6ad6472dab4c2bac6f14a416122571
          name: 'System: Contact'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.4.0
          key: system.contact
          delay: 1h
          history: 7d
          value_type: CHAR
          preprocessing:
