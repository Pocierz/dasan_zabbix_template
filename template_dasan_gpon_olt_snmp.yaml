              recovery_expression: 'min(/DASAN GPON OLT SLE by SNMP/gpon.ont.rxpower[{#SNMPINDEX}],30m)>({$GPON.ONT.RX.CRIT}+1)'
              name: 'ONT {#PONPORT}:{#ONTID} [{#ONTDESC}]: ONT Rx power is critically low'
              event_name: 'ONT {#PONPORT}:{#ONTID} [{#ONTDESC}]: ONT Rx power is below {$GPON.ONT.RX.CRIT} dBm'
              priority: INFO
              description: |
                Downstream power measured by the ONT itself.
                
                Deliberately NOT gated on asymmetry - this is the absolute floor, so an ONT at a genuinely bad level stays visible even when its loss is symmetric. The warning-level trigger carries the asymmetry gate.
                
                Recovery needs 1 dB of margin past the threshold so the trigger does not flap.
              manual_close: 'YES'
              dependencies:
                - name: 'ONT {#PONPORT}:{#ONTID} [{#ONTDESC}]: ONT is not active'
                  expression: 'last(/DASAN GPON OLT SLE by SNMP/gpon.ont.status[{#SNMPINDEX}])<>2 and count(/DASAN GPON OLT SLE by SNMP/gpon.ont.status[{#SNMPINDEX}],{$GPON.ONT.DOWN.LOOKBACK},"eq","2")>0'
