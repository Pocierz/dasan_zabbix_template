        - uuid: 25951c4b189f4281b5abb87c9428bf37
          name: 'Interfaces: Get octet counters'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.2.1.31.1.1.1.6,1.3.6.1.2.1.31.1.1.1.10]'
          key: net.if.walk.octets
          history: '0'
          value_type: TEXT
