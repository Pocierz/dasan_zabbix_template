          trigger_prototypes:
            - uuid: 758945c1bc75463ba5c178c275e9538d
              expression: 'last(/DASAN GPON OLT SLE by SNMP/gpon.ont.status[{#SNMPINDEX}])=2 and avg(/DASAN GPON OLT SLE by SNMP/gpon.ont.rxpower[{#SNMPINDEX}],1h)<avg(/DASAN GPON OLT SLE by SNMP/gpon.ont.rxpower[{#SNMPINDEX}],7d:now-1h)-{$GPON.RX.DROP}'
