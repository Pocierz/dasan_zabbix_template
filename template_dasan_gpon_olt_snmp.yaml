          tags:
            - tag: component
              value: raw
        - uuid: 044bc1cc91b84a6ba17b8a3bb74dbf1c
          name: 'Interfaces: Get packet counters'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.2.1.31.1.1.1.7,1.3.6.1.2.1.31.1.1.1.8,1.3.6.1.2.1.31.1.1.1.9,1.3.6.1.2.1.31.1.1.1.11,1.3.6.1.2.1.31.1.1.1.12,1.3.6.1.2.1.31.1.1.1.13]'
          key: net.if.walk.pkts
          history: '0'
          value_type: TEXT
