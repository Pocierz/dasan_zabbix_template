        - uuid: 44a971c2d7a547a39a9d15482fc34832
          name: 'Memory: Utilization'
          type: CALCULATED
          key: vm.memory.util
          delay: 5m
          history: 7d
          value_type: FLOAT
          units: '%'
          params: '100*last(//vm.memory.used)/last(//vm.memory.total)'
          tags:
            - tag: component
              value: memory
          triggers:
            - uuid: 2fbb480fd0044b7fa8463c1079ce0fa6
              expression: 'min(/DASAN GPON OLT SLE by SNMP/vm.memory.util,10m)>{$MEMORY.UTIL.MAX}'
              name: 'Memory: High memory utilization'
              event_name: 'Memory: High memory utilization (>{$MEMORY.UTIL.MAX}% for 10m)'
              priority: AVERAGE
              tags:
                - tag: scope
