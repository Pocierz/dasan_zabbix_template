        - uuid: 5be84777eb42481ba239c007e14b550c
          name: 'System: Uptime (network)'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.3.0
          key: system.net.uptime
          history: 7d
          value_type: FLOAT
          units: uptime
          description: 'DISMAN-EVENT-MIB::sysUpTimeInstance - time since the network management portion of the system was last re-initialized.'
          preprocessing:
