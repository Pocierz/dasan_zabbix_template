              name: 'ONT {#PONPORT}:{#ONTID} [{#ONTDESC}]: Optical module voltage'
              type: DEPENDENT
              key: 'gpon.ont.voltage[{#SNMPINDEX}]'
              history: 7d
              value_type: FLOAT
              units: V
              description: sleGponOnuAniOpticModuleVoltage.
              preprocessing:
