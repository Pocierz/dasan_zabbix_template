        - uuid: eb068f180dde4819b676660af407c7bc
          name: 'SNMP: Agent availability'
          type: INTERNAL
          key: 'zabbix[host,snmp,available]'
          history: 7d
          trends: '0'
          valuemap:
            name: zabbix.host.available
          tags:
            - tag: component
              value: availability
          triggers:
            - uuid: fe77a0717bfc41ad944b32ef69c8a8e1
              expression: 'last(/DASAN GPON OLT SLE by SNMP/zabbix[host,snmp,available])=0'
              name: 'SNMP: No SNMP data collection'
              priority: AVERAGE
              description: 'SNMP is not responding on the OLT.'
              tags:
                - tag: scope
                  value: availability
      discovery_rules:
        - uuid: 8d1f1d5d7cf84a048bd5ae6d7bb46f61
          name: 'GPON ONT discovery'
          type: DEPENDENT
          key: gpon.ont.discovery
          filter:
            evaltype: AND
            conditions:
              - macro: '{#ONTDESC}'
                value: '{$GPON.ONT.DESC.MATCHES}'
              - macro: '{#ONTDESC}'
                value: '{$GPON.ONT.DESC.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
          description: |
            Discovers every ONT provisioned on the OLT from sleGponOnuTable, on any number of PON ports.
            
            The SNMP index is <ponIfIndex>.<ontId>. A JavaScript step splits it into {#PONIFINDEX}/{#ONTID} and resolves {#PONPORT} from ifDescr, so the port label is whatever the device itself calls the port (e.g. GPON1/7) instead of being derived from the ifIndex numbering scheme.
            
            Use {$GPON.ONT.DESC.MATCHES} / {$GPON.ONT.DESC.NOT_MATCHES} to narrow the set, and disable item prototypes you do not need - every prototype is multiplied by the ONT count (1767 on the reference OLT).
          item_prototypes:
