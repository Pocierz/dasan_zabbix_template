              expression: 'min(/DASAN GPON OLT SLE by SNMP/system.cpu.load1m,10m)>{$CPU.UTIL.CRIT}'
              name: 'CPU: High CPU utilization'
              event_name: 'CPU: High CPU utilization (>{$CPU.UTIL.CRIT}% for 10m)'
