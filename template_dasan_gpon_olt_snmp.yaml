                    The trigger only fires for ONTs seen active within {$GPON.ONT.DOWN.LOOKBACK}, so provisioned-but-never-connected entries stay quiet. On a fresh install nothing fires until enough history has accumulated - that is intentional.
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: availability
            - uuid: 4ac9bf57f35d4dce87ec15a8feb44c58
              name: 'ONT {#PONPORT}:{#ONTID} [{#ONTDESC}]: Optical module temperature'
              type: DEPENDENT
              key: 'gpon.ont.temp[{#SNMPINDEX}]'
              history: 7d
