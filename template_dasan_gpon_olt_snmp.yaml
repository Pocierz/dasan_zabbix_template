  triggers:
    - uuid: 63dcbd7cbb99486c829a0b7bda4af83c
      expression: '(last(/DASAN GPON OLT SLE by SNMP/gpon.ont.count.active,#2)-last(/DASAN GPON OLT SLE by SNMP/gpon.ont.count.active))>={$GPON.ONT.MASS.DROP} and last(/DASAN GPON OLT SLE by SNMP/gpon.ont.count.total)=last(/DASAN GPON OLT SLE by SNMP/gpon.ont.count.total,#2)'
      name: 'GPON: Mass ONT outage - {$GPON.ONT.MASS.DROP}+ active ONTs went down'
      event_name: 'GPON: {$GPON.ONT.MASS.DROP}+ ONTs dropped out of service between two checks'
      priority: DISASTER
      description: |
        Fires on the transition, so close it once the outage is handled.
        
        Guarded on gpon.ont.count.total being unchanged: a truncated SNMP walk lowers the active count as well, and that must not raise a disaster.
      manual_close: 'YES'
      tags:
        - tag: component
          value: gpon
        - tag: scope
          value: availability
    - uuid: af5df841dfa04db8a463af7952870c0b
      expression: 'last(/DASAN GPON OLT SLE by SNMP/gpon.ont.count.active)/last(/DASAN GPON OLT SLE by SNMP/gpon.ont.count.total)*100<{$GPON.ONT.ACTIVE.MIN}'
      name: 'GPON: Share of active ONTs dropped'
      event_name: 'GPON: fewer than {$GPON.ONT.ACTIVE.MIN}% of provisioned ONTs are active'
      priority: HIGH
      description: 'A sudden drop of the active share usually means a PON port, a feeder fibre or a whole splitter went down rather than a single subscriber.'
      dependencies:
        - name: 'GPON: Mass ONT outage - {$GPON.ONT.MASS.DROP}+ active ONTs went down'
          expression: '(last(/DASAN GPON OLT SLE by SNMP/gpon.ont.count.active,#2)-last(/DASAN GPON OLT SLE by SNMP/gpon.ont.count.active))>={$GPON.ONT.MASS.DROP} and last(/DASAN GPON OLT SLE by SNMP/gpon.ont.count.total)=last(/DASAN GPON OLT SLE by SNMP/gpon.ont.count.total,#2)'
      tags:
        - tag: scope
          value: availability
