              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'min(/DASAN GPON OLT SLE by SNMP/gpon.ont.rxpower[{#SNMPINDEX}],30m)>({$GPON.ONT.RX.MIN}+1) or (avg(/DASAN GPON OLT SLE by SNMP/gpon.ont.rxpower[{#SNMPINDEX}],30m)-avg(/DASAN GPON OLT SLE by SNMP/gpon.ont.oltrxpower[{#SNMPINDEX}],30m))<={$GPON.RX.ASYM.MIN}'
              name: 'ONT {#PONPORT}:{#ONTID} [{#ONTDESC}]: ONT Rx power is low'
              event_name: 'ONT {#PONPORT}:{#ONTID} [{#ONTDESC}]: ONT Rx power is below {$GPON.ONT.RX.MIN} dBm'
              priority: INFO
              description: |
                Downstream power measured by the ONT itself.
                
                Recovery needs 1 dB of margin past the threshold so the trigger does not flap.
              manual_close: 'YES'
              dependencies:
                - name: 'ONT {#PONPORT}:{#ONTID} [{#ONTDESC}]: ONT is not active'
                  expression: 'last(/DASAN GPON OLT SLE by SNMP/gpon.ont.status[{#SNMPINDEX}])<>2 and count(/DASAN GPON OLT SLE by SNMP/gpon.ont.status[{#SNMPINDEX}],{$GPON.ONT.DOWN.LOOKBACK},"eq","2")>0'
                - name: 'ONT {#PONPORT}:{#ONTID} [{#ONTDESC}]: ONT Rx power is critically low'
                  expression: 'last(/DASAN GPON OLT SLE by SNMP/gpon.ont.status[{#SNMPINDEX}])=2 and max(/DASAN GPON OLT SLE by SNMP/gpon.ont.rxpower[{#SNMPINDEX}],30m)<{$GPON.ONT.RX.CRIT}'
                  recovery_expression: 'min(/DASAN GPON OLT SLE by SNMP/gpon.ont.rxpower[{#SNMPINDEX}],30m)>({$GPON.ONT.RX.CRIT}+1)'
              tags:
                - tag: scope
                  value: performance
            - uuid: 723c661b899d4cccb38c998f52548562
              expression: 'last(/DASAN GPON OLT SLE by SNMP/gpon.ont.status[{#SNMPINDEX}])=2 and min(/DASAN GPON OLT SLE by SNMP/gpon.ont.rxpower[{#SNMPINDEX}],30m)>{$GPON.ONT.RX.MAX}'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'max(/DASAN GPON OLT SLE by SNMP/gpon.ont.rxpower[{#SNMPINDEX}],30m)<({$GPON.ONT.RX.MAX}-1)'
              name: 'ONT {#PONPORT}:{#ONTID} [{#ONTDESC}]: ONT Rx power is too high'
              event_name: 'ONT {#PONPORT}:{#ONTID} [{#ONTDESC}]: ONT Rx power is above {$GPON.ONT.RX.MAX} dBm'
              priority: INFO
              description: |
                The ONT may sit too close to the OLT or an attenuator is missing - the receiver can saturate.
                
                Recovery needs 1 dB of margin past the threshold so the trigger does not flap.
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: performance
            - uuid: 2b1f9ffe7c1444119133c5ba651c00f4
              expression: 'last(/DASAN GPON OLT SLE by SNMP/gpon.ont.status[{#SNMPINDEX}])=2 and avg(/DASAN GPON OLT SLE by SNMP/gpon.ont.oltrxpower[{#SNMPINDEX}],1h)<avg(/DASAN GPON OLT SLE by SNMP/gpon.ont.oltrxpower[{#SNMPINDEX}],7d:now-1h)-{$GPON.RX.DROP}'
              name: 'ONT {#PONPORT}:{#ONTID} [{#ONTDESC}]: Upstream power at the OLT dropped against its baseline'
              event_name: 'ONT {#PONPORT}:{#ONTID} [{#ONTDESC}]: OLT Rx power fell more than {$GPON.RX.DROP} dB below its 7-day average'
              status: DISABLED
              priority: AVERAGE
              manual_close: 'YES'
              dependencies:
                - name: 'ONT {#PONPORT}:{#ONTID} [{#ONTDESC}]: ONT is not active'
                  expression: 'last(/DASAN GPON OLT SLE by SNMP/gpon.ont.status[{#SNMPINDEX}])<>2 and count(/DASAN GPON OLT SLE by SNMP/gpon.ont.status[{#SNMPINDEX}],{$GPON.ONT.DOWN.LOOKBACK},"eq","2")>0'
              tags:
                - tag: scope
                  value: performance
            - uuid: e946554077cf402b9348b12085c847fe
              expression: 'last(/DASAN GPON OLT SLE by SNMP/gpon.ont.status[{#SNMPINDEX}])=2 and max(/DASAN GPON OLT SLE by SNMP/gpon.ont.oltrxpower[{#SNMPINDEX}],30m)<{$GPON.OLT.RX.CRIT}'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'min(/DASAN GPON OLT SLE by SNMP/gpon.ont.oltrxpower[{#SNMPINDEX}],30m)>({$GPON.OLT.RX.CRIT}+1)'
              name: 'ONT {#PONPORT}:{#ONTID} [{#ONTDESC}]: Upstream power at the OLT is critically low'
              event_name: 'ONT {#PONPORT}:{#ONTID} [{#ONTDESC}]: OLT Rx power is below {$GPON.OLT.RX.CRIT} dBm'
              status: DISABLED
              priority: AVERAGE
              description: |
                Upstream power from this ONT as received by the OLT. Compare it with other ONTs on the same PON port, NOT with the ONT Rx value - upstream runs several dB lower by design.
                
                Recovery needs 1 dB of margin past the threshold so the trigger does not flap.
              manual_close: 'YES'
              dependencies:
                - name: 'ONT {#PONPORT}:{#ONTID} [{#ONTDESC}]: ONT is not active'
                  expression: 'last(/DASAN GPON OLT SLE by SNMP/gpon.ont.status[{#SNMPINDEX}])<>2 and count(/DASAN GPON OLT SLE by SNMP/gpon.ont.status[{#SNMPINDEX}],{$GPON.ONT.DOWN.LOOKBACK},"eq","2")>0'
              tags:
                - tag: scope
                  value: performance
            - uuid: c38930cb8c764060aec796221ae471bf
              expression: 'last(/DASAN GPON OLT SLE by SNMP/gpon.ont.status[{#SNMPINDEX}])=2 and max(/DASAN GPON OLT SLE by SNMP/gpon.ont.oltrxpower[{#SNMPINDEX}],30m)<{$GPON.OLT.RX.MIN}'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'min(/DASAN GPON OLT SLE by SNMP/gpon.ont.oltrxpower[{#SNMPINDEX}],30m)>({$GPON.OLT.RX.MIN}+1)'
              name: 'ONT {#PONPORT}:{#ONTID} [{#ONTDESC}]: Upstream power at the OLT is low'
              event_name: 'ONT {#PONPORT}:{#ONTID} [{#ONTDESC}]: OLT Rx power is below {$GPON.OLT.RX.MIN} dBm'
              status: DISABLED
              priority: WARNING
              description: |
                Upstream power from this ONT as received by the OLT. Compare it with other ONTs on the same PON port, NOT with the ONT Rx value - upstream runs several dB lower by design.
                
                Recovery needs 1 dB of margin past the threshold so the trigger does not flap.
              manual_close: 'YES'
              dependencies:
                - name: 'ONT {#PONPORT}:{#ONTID} [{#ONTDESC}]: ONT is not active'
                  expression: 'last(/DASAN GPON OLT SLE by SNMP/gpon.ont.status[{#SNMPINDEX}])<>2 and count(/DASAN GPON OLT SLE by SNMP/gpon.ont.status[{#SNMPINDEX}],{$GPON.ONT.DOWN.LOOKBACK},"eq","2")>0'
                - name: 'ONT {#PONPORT}:{#ONTID} [{#ONTDESC}]: Upstream power at the OLT is critically low'
                  expression: 'last(/DASAN GPON OLT SLE by SNMP/gpon.ont.status[{#SNMPINDEX}])=2 and max(/DASAN GPON OLT SLE by SNMP/gpon.ont.oltrxpower[{#SNMPINDEX}],30m)<{$GPON.OLT.RX.CRIT}'
                  recovery_expression: 'min(/DASAN GPON OLT SLE by SNMP/gpon.ont.oltrxpower[{#SNMPINDEX}],30m)>({$GPON.OLT.RX.CRIT}+1)'
              tags:
                - tag: scope
                  value: performance
          master_item:
            key: gpon.ont.walk.discovery
          preprocessing:
            - type: SNMP_WALK_TO_JSON
              parameters:
                - '{#ONTSERIAL}'
                - 1.3.6.1.4.1.6296.101.23.3.1.1.4
                - '0'
                - '{#ONTPROFILE}'
                - 1.3.6.1.4.1.6296.101.23.3.1.1.8
                - '0'
                - '{#ONTMODEL}'
                - 1.3.6.1.4.1.6296.101.23.3.1.1.17
                - '0'
                - '{#ONTDESC}'
                - 1.3.6.1.4.1.6296.101.23.3.1.1.18
                - '0'
                - '{#PONPORT}'
                - 1.3.6.1.2.1.2.2.1.2
                - '0'
            - type: JAVASCRIPT
              parameters:
                - |
                  var rows = JSON.parse(value);
                  var strip = function (s) {
                      return String(s ===  undefined || s === null ? '' : s)
                          .replace(/^["\s]+|["\s]+$/g, '');
                   };
                  
                  // The walk mixes two index shapes: a bare ifIndex for ifDescr rows and
                  // <ifIndex>.<ontId>  for the ONU table. Build the port-name map from the former,
                  // then emit only the  latter.
                  var portName = {};
                  var onts = [];
                  rows.forEach(function (row) {
                      var  idx = String(row['{#SNMPINDEX}'] || '');
                      if (idx.indexOf('.') === -1) {
                           portName[idx] = strip(row['{#PONPORT}']);
                      } else {
                          onts.push(row);
                       }
                  });
                  
                  onts.forEach(function (row) {
                      ['{#ONTSERIAL}', '{#ONTPROFILE}',  '{#ONTMODEL}', '{#ONTDESC}']
                          .forEach(function (m) { row[m] = strip(row[m]);  });
                      var parts = String(row['{#SNMPINDEX}']).split('.');
                      row['{#PONIFINDEX}']  = parts[0];
                      row['{#ONTID}'] = parts[1];
                      row['{#PONPORT}'] = portName[parts[0]]  || ('ifIndex' + parts[0]);
                      if (!row['{#ONTDESC}']) {
                          row['{#ONTDESC}']  = row['{#ONTSERIAL}'];
                      }
                  });
                  return JSON.stringify(onts);
        - uuid: 6c6d227483f14f028110c24eb712be4d
          name: 'GPON PON port discovery'
          type: DEPENDENT
          key: gpon.pon.discovery
          filter:
            conditions:
              - macro: '{#IFDESCR}'
                value: '{$GPON.PON.DESCR.MATCHES}'
          description: 'Discovers just the PON ports, so per-port ONT counters can exist as individual items. Reuses the interface walk - no extra SNMP traffic.'
          item_prototypes:
            - uuid: 150b4380392c4c4b874532b82891fea9
              name: 'PON {#IFDESCR}: Active ONTs'
              type: DEPENDENT
              key: 'gpon.pon.ont.active[{#SNMPINDEX}]'
              history: 90d
              description: 'Number of ONTs in state active(2) on this PON port.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var re = /^\.?1\.3\.6\.1\.4\.1\.6296\.101\.23\.3\.1\.1\.2\.{#SNMPINDEX}\.[0-9]+\s*=\s*(?:[A-Za-z0-9-]+:\s*)?(-?\d+)\s*$/;
                      var active = 0;
                      value.split('\n').forEach(function (line) {
                          var m = re.exec(line.trim());
                          if (m && m[1] === '2') { active++; }
                      });
                      return active;
                      
              master_item:
                key: gpon.ont.walk.status
              tags:
                - tag: component
                  value: gpon
                - tag: pon-port
                  value: '{#IFDESCR}'
          trigger_prototypes:
            - uuid: 3262887f03174e3cafb6a81238c06b54
              expression: '(last(/DASAN GPON OLT SLE by SNMP/gpon.pon.ont.active[{#SNMPINDEX}],#2)-last(/DASAN GPON OLT SLE by SNMP/gpon.pon.ont.active[{#SNMPINDEX}]))>={$GPON.PON.DROP} and last(/DASAN GPON OLT SLE by SNMP/gpon.ont.count.total)=last(/DASAN GPON OLT SLE by SNMP/gpon.ont.count.total,#2)'
              name: 'PON {#IFDESCR}: {$GPON.PON.DROP} or more ONTs went inactive at once'
              event_name: 'PON {#IFDESCR}: {$GPON.PON.DROP}+ ONTs went inactive between two checks'
              priority: HIGH
              description: |
                A simultaneous drop on one PON port points at the feeder fibre, the splitter or a power cut in one building - not at individual subscribers.
                
                Guarded on gpon.ont.count.total being unchanged: a truncated SNMP walk lowers the per-port count too, and that must not look like an outage.
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
          master_item:
            key: net.if.walk.discovery
          preprocessing:
            - type: SNMP_WALK_TO_JSON
              parameters:
                - '{#IFDESCR}'
                - 1.3.6.1.2.1.2.2.1.2
                - '0'
            - type: JAVASCRIPT
              parameters:
                - |
                  var rows = JSON.parse(value);
                  rows.forEach(function (row) {
                      row['{#IFDESCR}'] = String(row['{#IFDESCR}'] || '')
                          .replace(/^["\s]+|["\s]+$/g, '');
                  });
                  return JSON.stringify(rows);
                  
        - uuid: aa67ee6ea12d4dd394a17a205f9230b6
          name: 'Network interfaces discovery'
          type: DEPENDENT
          key: net.if.discovery
          filter:
            evaltype: AND
            conditions:
              - macro: '{#IFDESCR}'
                value: '{$IF.DESCR.MATCHES}'
              - macro: '{#IFDESCR}'
                value: '{$IF.DESCR.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
              - macro: '{#IFHIGHSPEED}'
                value: '{$IF.HIGHSPEED.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
          description: |
            Discovers physical ports on any SLE-platform box, regardless of how the ports are named (XE/GE/TE/GPON/PON...).
            
            The default filter keeps every interface whose ifHighSpeed is non-zero. On this platform that is exactly the set of real ports: the internal bridge interfaces (br*, default), the loopback and the channel group report speed 0, while ports that are merely operationally down still report their nominal speed - so nothing real is lost.
            
            Use {$IF.DESCR.MATCHES} / {$IF.DESCR.NOT_MATCHES} to narrow the set further, e.g. "^GPON" for PON ports only.
          item_prototypes:
            - uuid: 313527ea1c584f0b8cf1d82bfab99e59
              name: 'Interface {#IFDESCR}({#IFALIAS}): Administrative status'
              type: DEPENDENT
              key: 'net.if.adminstatus[{#SNMPINDEX}]'
              history: 7d
              description: ifAdminStatus.
              valuemap:
                name: 'IF-MIB::ifAdminStatus'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.2.2.1.7.{#SNMPINDEX}'
                    - '0'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: net.if.walk.status
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFDESCR}'
            - uuid: 64a9c0350fb04f8084823ed841605452
              name: 'Interface {#IFDESCR}({#IFALIAS}): Inbound broadcast packets'
              type: DEPENDENT
              key: 'net.if.in.bcast[{#SNMPINDEX}]'
              history: 7d
              value_type: FLOAT
              units: '!pps'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.31.1.1.1.9.{#SNMPINDEX}'
