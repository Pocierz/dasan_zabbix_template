                - 1d
          tags:
            - tag: component
              value: system
        - uuid: 8f9bef0c9e30402ab23bd5504ae4f72a
          name: 'CPU: Load 1m'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.6296.9.1.1.1.9.0
          key: system.cpu.load1m
          history: 7d
          value_type: FLOAT
          units: '%'
          description: dsCpuLoad1m.
          tags:
            - tag: component
              value: cpu
          triggers:
