          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.2.1.2.2.1.14,1.3.6.1.2.1.2.2.1.20,1.3.6.1.2.1.2.2.1.13,1.3.6.1.2.1.2.2.1.19]'
          key: net.if.walk.errors
          delay: 3m
