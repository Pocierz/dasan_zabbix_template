            - uuid: 687bf5fbdb3a470a8379e741a33a6280
              name: 'Interface {#IFDESCR}({#IFALIAS}): Speed'
              type: DEPENDENT
              key: 'net.if.speed[{#SNMPINDEX}]'
              history: 7d
              units: bps
              description: 'ifHighSpeed x 1000000. Note: GPON ports report 2500 Mbps, which is the downstream line rate. The upstream line rate is 1.25 Gbps, so inbound utilization on a PON port is understated by roughly a factor of two.'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.31.1.1.1.15.{#SNMPINDEX}'
                    - '0'
                - type: MULTIPLIER
                  parameters:
                    - '1000000'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: net.if.walk.status
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFDESCR}'
            - uuid: 27da443425304d4aac797343e2d5e1f8
              name: 'Interface {#IFDESCR}({#IFALIAS}): Operational status'
              type: DEPENDENT
              key: 'net.if.status[{#SNMPINDEX}]'
              history: 7d
              description: ifOperStatus.
              valuemap:
                name: 'IF-MIB::ifOperStatus'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}'
                    - '0'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: net.if.walk.status
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFDESCR}'
          trigger_prototypes:
            - uuid: f53b33c1e2d845a78bcbcfeaf66f5669
              expression: 'last(/DASAN GPON OLT SLE by SNMP/net.if.status[{#SNMPINDEX}])=2 and last(/DASAN GPON OLT SLE by SNMP/net.if.adminstatus[{#SNMPINDEX}])=1'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'last(/DASAN GPON OLT SLE by SNMP/net.if.status[{#SNMPINDEX}])<>2'
              name: 'Interface {#IFDESCR}({#IFALIAS}): Link down'
              priority: WARNING
              description: 'The interface is administratively up but operationally down.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
          graph_prototypes:
            - uuid: fc91a42dd3b94214a82d2de9e0ffa336
              name: 'Interface {#IFDESCR}({#IFALIAS}): Network traffic'
              graph_items:
                - drawtype: FILLED_REGION
                  color: 199C0D
                  calc_fnc: ALL
                  item:
                    host: 'DASAN GPON OLT SLE by SNMP'
                    key: 'net.if.in[{#SNMPINDEX}]'
                - sortorder: '1'
                  color: '891515'
                  calc_fnc: ALL
                  item:
                    host: 'DASAN GPON OLT SLE by SNMP'
                    key: 'net.if.out[{#SNMPINDEX}]'
                - sortorder: '2'
                  color: FF8000
                  calc_fnc: ALL
                  item:
                    host: 'DASAN GPON OLT SLE by SNMP'
                    key: 'net.if.in.errors[{#SNMPINDEX}]'
                - sortorder: '3'
                  color: 2774A4
                  calc_fnc: ALL
                  item:
                    host: 'DASAN GPON OLT SLE by SNMP'
                    key: 'net.if.out.errors[{#SNMPINDEX}]'
          master_item:
            key: net.if.walk.discovery
          preprocessing:
            - type: SNMP_WALK_TO_JSON
              parameters:
                - '{#IFDESCR}'
                - 1.3.6.1.2.1.2.2.1.2
                - '0'
                - '{#IFALIAS}'
                - 1.3.6.1.2.1.31.1.1.1.18
                - '0'
                - '{#IFTYPE}'
                - 1.3.6.1.2.1.2.2.1.3
                - '0'
                - '{#IFOPERSTATUS}'
                - 1.3.6.1.2.1.2.2.1.8
                - '0'
                - '{#IFADMINSTATUS}'
                - 1.3.6.1.2.1.2.2.1.7
                - '0'
                - '{#IFHIGHSPEED}'
                - 1.3.6.1.2.1.31.1.1.1.15
                - '0'
            - type: JAVASCRIPT
              parameters:
                - |
                  var rows = JSON.parse(value);
                  rows.forEach(function (row) {
                      ['{#IFDESCR}', '{#IFALIAS}'].forEach(function  (m) {
                          row[m] = String(row[m] === undefined || row[m] === null ? '' : row[m])
                               .replace(/^["\s]+|["\s]+$/g, '');
                      });
                  });
                  return JSON.stringify(rows);
      macros:
        - macro: '{$CPU.UTIL.CRIT}'
          value: '90'
          description: 'CPU utilization trigger threshold, %.'
        - macro: '{$GPON.OLT.RX.CRIT}'
          value: '-32'
          description: 'Critical threshold for the upstream power at the OLT, dBm. -32 dBm is the receiver sensitivity of GPON class C+ optics, so below this the link is out of spec. Use -28 instead if the OLT is fitted with class B+ optics.'
        - macro: '{$GPON.OLT.RX.MIN}'
          value: '-30.5'
          description: |
            Warning threshold for the upstream power the OLT receives from an ONT, dBm.
            IMPORTANT: upstream is NOT comparable with downstream. The ONT transmits at about +2.5 dBm while the OLT transmits several dB harder, so the upstream reading sits systematically lower. On the reference OLT the median ONT Rx is -21.1 dBm while the median OLT Rx is -26.5 dBm - a healthy 5.4 dB gap.
            Measured distribution: median -26.5, 5th pct -30.4, 1st pct -32.2, worst -33.9. This default flags the worst ~4%. Do not reuse the ONT Rx threshold here - a value like -28 dBm sits in the middle of the healthy population and would alarm on a quarter of the estate.
        - macro: '{$GPON.ONT.ACTIVE.MIN}'
          value: '80'
          description: 'Minimum share of provisioned ONTs that should be active, %.'
        - macro: '{$GPON.ONT.DESC.MATCHES}'
          value: '.*'
          description: 'ONTs whose sleGponOnuDescription matches this regexp are discovered.'
        - macro: '{$GPON.ONT.DESC.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
          description: 'ONTs whose sleGponOnuDescription matches this regexp are NOT discovered.'
        - macro: '{$GPON.ONT.DOWN.LOOKBACK}'
          value: 7d
          description: 'An ONT only raises a down alarm if it was seen active within this window. Keeps provisioned-but-never-connected entries out of the problem list (185 of 1767 on the reference OLT).'
        - macro: '{$GPON.ONT.FLAP.COUNT}'
          value: '3'
          description: 'Number of link drops within one hour that counts as flapping.'
        - macro: '{$GPON.ONT.MASS.DROP}'
          value: '100'
          description: 'How many active ONTs may disappear OLT-wide between two checks before it is treated as a mass outage. At this scale it is a feeder fibre, a card or a power event, not subscribers switching off.'
        - macro: '{$GPON.ONT.RX.CRIT}'
          value: '-27'
          description: 'ONT Rx power critical threshold, dBm. Flags the worst ~0.3% on the reference OLT.'
        - macro: '{$GPON.ONT.RX.MAX}'
          value: '-8'
          description: 'ONT Rx power upper threshold, dBm - above this the receiver may saturate.'
        - macro: '{$GPON.ONT.RX.MIN}'
          value: '-25'
          description: 'ONT Rx power (downstream) warning threshold, dBm. Measured on the reference OLT over 1582 active ONTs: median -21.1, 5th pct -23.9, 1st pct -25.4, worst -30.0. This default flags the worst ~1.5%.'
        - macro: '{$GPON.ONT.TEMP.MAX}'
          value: '75'
          description: 'ONT optical module temperature threshold, °C.'
        - macro: '{$GPON.PON.DESCR.MATCHES}'
          value: GPON
          description: 'Regexp identifying PON ports by ifDescr, for the per-port ONT counters. Deliberately NOT anchored: port naming differs between models - "GPON2/3" on a V8102 but "Port10-GPON" on other chassis. An anchored "^GPON" silently discovers nothing on the latter.'
        - macro: '{$GPON.PON.DROP}'
          value: '10'
          description: 'How many ONTs may disappear from one PON port between two checks before it is treated as a fibre/splitter fault rather than individual subscribers.'
        - macro: '{$GPON.RX.ASYM.MIN}'
          value: '5'
          description: 'Minimum ONT Rx - OLT Rx asymmetry, in dB, required before a low ONT Rx power raises an alarm. A link that is weak in BOTH directions by the same amount is simply a long/heavily-split path; a link that is weak only downstream points at a real fault. Measured on this OLT the asymmetry is 5.55 dB median (min 0.06, max 12.62), so this gate keeps the genuinely lopsided links only.'
        - macro: '{$GPON.RX.DROP}'
          value: '4'
          description: 'How far the Rx power may fall below its own 7-day baseline before alerting, dB. This is the threshold that actually finds new faults: it is independent of the absolute level, so it works equally well for an ONT sitting at -18 and one sitting at -29 dBm.'
        - macro: '{$IF.BCAST.WARN}'
          value: '5000'
          description: 'Inbound broadcast rate that is treated as a broadcast storm, pps.'
        - macro: '{$IF.DESCR.MATCHES}'
          value: '.*'
          description: 'Interfaces whose ifDescr matches this regexp are discovered. Set it to e.g. "^GPON" to monitor PON ports only, or "^(XE|GE)" for uplinks only.'
        - macro: '{$IF.DESCR.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
          description: 'Interfaces whose ifDescr matches this regexp are NOT discovered.'
        - macro: '{$IF.ERRORS.WARN}'
          value: '2'
          description: 'Interface error rate trigger threshold, pps.'
        - macro: '{$IF.HIGHSPEED.NOT_MATCHES}'
          value: ^0$
          description: 'Interfaces whose ifHighSpeed matches this regexp are NOT discovered. The default drops interfaces that report no nominal speed - bridges, loopback and channel groups on this platform. Set it to CHANGE_IF_NEEDED to keep them.'
        - macro: '{$IF.UTIL.MAX}'
          value: '90'
          description: 'Interface utilization trigger threshold, %.'
        - macro: '{$MEMORY.UTIL.MAX}'
          value: '90'
          description: 'Memory utilization trigger threshold, %.'
        - macro: '{$SNMP.TIMEOUT}'
          value: 5m
          description: 'No-data period used by SNMP availability triggers.'
